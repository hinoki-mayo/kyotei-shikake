name: 今の方法で再生(確定オッズ)

# その日のレースを、レース後に確定オッズで今の方法のまま作り直す。実戦(締切前のオッズ)との差を毎日測るため、夜に自動で動く
on:
  schedule:
    - cron: "40 13 * * *"   # 22:40 JST(ナイターが終わった後)
  workflow_dispatch:
    inputs:
      dates:
        description: "日付(空白区切り。空なら今日。例 20261014 20261015)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: replay-live
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/replay_live.py ${{ inputs.dates }}
        env:
          OMP_NUM_THREADS: "1"
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/bets_replay
          git diff --cached --quiet || git commit -m "今の方法で再生(確定オッズ) ${{ inputs.dates }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
