name: 調べもの(ブラウザで開いて保存)

# 場の公式サイトをブラウザで開いて、オリジナル展示がどこにあるか探す。debug-render ブランチに置く(運用には使わない)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "空白区切りの開始URL"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: 開いて保存
        env:
          URLS: ${{ inputs.urls }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir out
          python scripts/render_debug.py out $URLS || true
          cd out
          git init -q && git checkout -q -b debug-render
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "ブラウザで開いた場のサイト $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" debug-render
