name: オリ展の過去分取り込み

on:
  workflow_dispatch:
    inputs:
      start:
        description: "さかのぼる下限の日 (例 20240101)"
        required: true
        default: "20240101"

permissions:
  contents: write

concurrency:
  group: orig-backfill
  cancel-in-progress: false

jobs:
  orig:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        jcd: ["06", "08", "10", "13", "20", "21", "23"]   # 浜名湖・常滑・三国・尼崎・若松・芦屋・唐津
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cd scripts && python backfill_orig.py --jcd ${{ matrix.jcd }} --start ${{ inputs.start }} --max-minutes 330
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/orig_race 2>/dev/null || true
          git diff --cached --quiet || git commit -m "オリ展の過去分 ${{ matrix.jcd }}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
