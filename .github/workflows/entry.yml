name: 展示の進入を反映

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/entry.py
      - id: chk
        run: test -z "$(git status --porcelain data)" || echo "changed=1" >> $GITHUB_OUTPUT
      - if: steps.chk.outputs.changed == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "展示反映 $(TZ=Asia/Tokyo date +%H:%M)"
          git pull --rebase
          git push
      # サイト作りが失敗しても、取り込んだ展示・買い目のデータは先に保存しておく
      - run: python scripts/build_site.py
        env:
          SHARE_KEY: ${{ secrets.SHARE_KEY }}
      - if: vars.CF_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=main
