name: 予想とサイトの更新

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/daily.py
      - run: python scripts/predict.py
      - run: python scripts/build_site.py
        env:
          SHARE_KEY: ${{ secrets.SHARE_KEY }}
      - name: 保存(予想データの更新履歴が事前公開の証明になる)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "予想更新 $(TZ=Asia/Tokyo date +%Y-%m-%d_%H:%M)"
          git pull --rebase
          git push
      - name: 公開(Cloudflare Pages)
        if: ${{ vars.CF_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=main
