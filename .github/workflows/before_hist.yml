name: 過去の直前情報取得

on:
  workflow_dispatch:
    inputs:
      start:
        description: "開始日 (例 2026-06-01)"
        required: true
        default: "2026-06-01"
      end:
        description: "終了日 (例 2026-09-30)"
        required: true
        default: "2026-09-30"

permissions:
  contents: write

concurrency:
  group: before-hist
  cancel-in-progress: false

jobs:
  before-hist:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # 日付を4つに分けて同時に取る(公式サイトの応答が遅いため)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_before_hist.py --start ${{ inputs.start }} --end ${{ inputs.end }} --max-minutes 330 --shard ${{ matrix.shard }} --shards 4
      - name: 取得した直前情報を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/before_hist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "直前情報 ${{ inputs.start }}〜${{ inputs.end }} (${{ matrix.shard }}/4)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
