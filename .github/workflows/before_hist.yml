name: 過去の直前情報取得

on:
  workflow_dispatch:
    inputs:
      start:
        description: "開始日 (例 2026-06-01)"
        required: true
        default: "2026-06-01"
      end:
        description: "終了日 (例 2026-09-30)"
        required: true
        default: "2026-09-30"
      round:
        description: "続き実行の回数(自動で増える)"
        required: false
        default: "1"
      left:
        description: "前の回の取り残し日数(自動。減らなくなったら止める)"
        required: false
        default: "99999"

permissions:
  contents: write

concurrency:
  group: before-hist
  cancel-in-progress: false

jobs:
  before-hist:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # 日付を4つに分けて同時に取る(公式サイトの応答が遅いため)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_before_hist.py --start ${{ inputs.start }} --end ${{ inputs.end }} --max-minutes 330 --shard ${{ matrix.shard }} --shards 4
      - name: 取得した直前情報を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/before_hist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "直前情報 ${{ inputs.start }}〜${{ inputs.end }} (${{ matrix.shard }}/4)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done

  # 時間切れで取り残しがあれば、同じ期間でもう一度自分を起動する(取り済みの日は飛ばす)。減らなくなったら止める
  next:
    needs: before-hist
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 取り残しがあれば続きを起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(cd scripts && python hist_todo.py before_hist ${{ inputs.start }} ${{ inputs.end }})
          echo "取り残し $n 日(前の回 ${{ inputs.left }} 日・${{ inputs.round }}回目)"
          if [ "$n" -gt 0 ] && [ "$n" -lt "${{ inputs.left }}" ] && [ "${{ inputs.round }}" -lt 60 ]; then
            gh workflow run before_hist.yml --ref main -f start=${{ inputs.start }} -f end=${{ inputs.end }} \
              -f round=$(( ${{ inputs.round }} + 1 )) -f left=$n
          fi
