name: 運用プランの作り直し

on:
  workflow_dispatch:
    inputs:
      date:
        description: "日付 (例 20261014)"
        required: true

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/backfill_ops.py --fetch ${{ inputs.date }}
      - run: python scripts/build_site.py
        env:
          SHARE_KEY: ${{ secrets.SHARE_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/bets_backfill
          git diff --cached --quiet || git commit -m "運用プラン作り直し ${{ inputs.date }}"
          git pull --rebase
          git push
      - if: vars.CF_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=main
