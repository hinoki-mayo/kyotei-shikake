name: 調べもの(公式ページを保存)

# 公式サイトのページの形を確かめるため、指定のページを保存して debug-pages ブランチに置く(サイト・運用には使わない)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "空白区切りのURL"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 保存してブランチに置く
        env:
          URLS: ${{ inputs.urls }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            curl -sL -A "Mozilla/5.0 (kyotei-shikake data fetcher)" --max-time 40 -o "page$i.html" "$u" || true
            echo "$u -> page$i.html $(wc -c < page$i.html)" >> index.txt
            sleep 2
          done
          git init -q && git checkout -q -b debug-pages
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "公式ページの保存 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" debug-pages
