name: 調べもの(場のサイトをたどって保存)

# 各場の公式サイトから展示・直前情報らしいページを少しだけ集めて debug-crawl ブランチに置く(運用には使わない)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "空白区切りの開始URL"
        required: true

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: たどって保存
        env:
          URLS: ${{ inputs.urls }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir out
          python scripts/crawl_debug.py out $URLS || true
          cd out
          git init -q && git checkout -q -b debug-crawl
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "場のサイトの保存 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" debug-crawl
